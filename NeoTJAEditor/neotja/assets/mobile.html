<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NeoTJA Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: NeoTJAEditor 作譜ペイン（300px 基準を画面高に合わせて等倍拡縮）| 右に道具列、下にノーツ札。Neo のダークテーマ固定。 */
:root{
  --bg:#0f1117; --bg2:#161b27; --bg3:#1e2535; --surface:#252d3d; --border:#2e3a50;
  --accent:#4f9cf9; --fg:#cdd6f4; --fg-dim:#6c7a96;
  --don:#ff6b6b; --ka:#5bc8fc; --roll:#fcdb38; --balloon:#ff9f43;
  --font:"Yu Gothic UI","Meiryo UI","Hiragino Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;margin:0;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;gap:6px;padding-block:6px;
  grid-template-columns:minmax(0,1fr) 54px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"title right" "pane right" "pal right"}
.titlebar{grid-area:title;display:flex;align-items:baseline;gap:8px;min-width:0;height:22px;padding:0 4px;text-align:left;border-radius:3px}
.titlebar:active{background:var(--bg2)}
.titlebar b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.titlebar span{font-size:12px;color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.titlebar em{font-style:normal;font-size:12px;color:var(--fg-dim);white-space:nowrap;margin-left:auto;flex:none}
.card h3{margin:4px 0 0;font-size:12px;color:var(--fg-dim);font-weight:normal;letter-spacing:.04em}
.fld .hint{font-size:10px;color:var(--fg-dim)}
.right{grid-row:1 / span 3}
/* 左手: 置く音符 */
.left{grid-area:left;display:flex;flex-direction:column;gap:3px;min-height:0}
.nb{flex:1;min-height:28px;border-radius:4px;border:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:6px;padding:0 6px;font-size:11px;white-space:nowrap}
.nb:active{background:var(--surface)}
.nb .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fbf3e0;flex:none}
.nb .dot.big{width:18px;height:18px;margin-left:-2px}
.nb .bar{width:16px;height:10px;border-radius:5px;flex:none}
.chip.armed{border-color:var(--accent);background:var(--surface)}
.nb.sub{color:var(--fg-dim)}
/* 右手: カーソルとモード */
/* 右の列。**はみ出させない。** 8個の縦並びなので、背の低い端末だと
   下(や上)が切れて再生ボタンが消えていた(利用者の報告 2026-10-24)。
   縮められる所まで縮めて、それでも足りなければ縦に送れるようにする。 */
.right{grid-area:right;display:flex;flex-direction:column;gap:3px;min-height:0;overflow-y:auto;scrollbar-width:none}
.right::-webkit-scrollbar{display:none}
.right .rb{flex:1 1 0;min-height:26px}
@media (max-height:420px){.rb svg{width:14px;height:14px}.rb{font-size:9px;gap:0}.right .rb{min-height:22px}}
.right .rb{flex:1}
.notes{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.notes::-webkit-scrollbar{display:none}
.mv{display:flex;gap:4px;flex:none}
.mv button{width:64px;height:40px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);color:var(--fg);font-size:20px;touch-action:manipulation}
.mv button:active{background:var(--surface)}
.rb{border-radius:4px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;min-height:0;touch-action:manipulation}
.rb svg{width:18px;height:18px;flex:none}
.rb.big{font-size:22px;background:var(--bg3)}
.rb:active{background:var(--surface)}
.rb.on{border-color:var(--accent)}
.rb small{font-size:9px;color:var(--fg-dim);line-height:1;white-space:nowrap;letter-spacing:-.06em}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.menu .btn{height:44px;text-align:left}
.vrow{display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:10px;font-size:13px}
.vrow input{accent-color:var(--accent);height:32px}
.vrow b{font-variant-numeric:tabular-nums;text-align:right;font-weight:normal;color:var(--fg-dim)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.zgrid .btn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.pane{grid-area:pane;position:relative;min-height:0;border:1px solid var(--border);overflow:hidden;background:var(--bg2)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);
  padding:4px 10px;border-radius:4px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
/* grid picker (Neo の左上「1/16」を押したときのつまみ) */
.picker{position:absolute;z-index:5;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:4px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.picker button{min-width:46px;height:30px;border-radius:3px;font-variant-numeric:tabular-nums;font-size:13px}
.picker button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
/* palette */
.pal{grid-area:pal;display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0}
.pal::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);
  display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.chip .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fbf3e0}
.chip .dot.big{width:18px;height:18px}
.chip .bar{width:22px;height:12px;border-radius:6px;flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--surface)}
.sep{width:1px;height:24px;background:var(--border);flex:none;margin:0 2px}
.val{flex:none;display:flex;align-items:center;gap:4px;font-size:12px;color:var(--fg-dim)}
.val input{width:58px;height:34px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--fg);
  font-size:13px;padding:0 6px;font-variant-numeric:tabular-nums}
/* tools */
.tool{flex:1;max-height:54px;min-height:34px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--fg-dim);background:var(--bg2);border:1px solid var(--border)}
.tool svg{width:20px;height:20px;flex:none}
.tool span{font-size:9px;line-height:1;white-space:nowrap}
.nav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.nav .chip{justify-content:center;min-width:44px}
.nav .mno{flex:none;font-variant-numeric:tabular-nums;font-size:13px;min-width:84px;text-align:center}
.nav input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:36px}
.tool.play{color:var(--fg)}
/* sheet */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;background:rgba(8,10,16,.72);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim);flex:1;min-width:110px}
.fld input,.fld select{height:34px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:14px;padding:0 8px;font-family:var(--font)}
textarea{width:100%;min-height:170px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--fg);
  font-family:Consolas,ui-monospace,monospace;font-size:12px;padding:8px;resize:vertical;-webkit-user-select:text;user-select:text}
.btn{height:34px;padding:0 14px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);font-size:13px}
.btn.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.note{font-size:12px;color:var(--fg-dim);line-height:1.6;margin:0}
/* 本文モード。譜面の画面の上にかぶせる(grid は触らない)。 */
.txt{position:fixed;inset:0;z-index:20;background:var(--bg);
  display:flex;flex-direction:column}
.txt .tabs{display:flex;gap:4px;padding:6px 8px;background:var(--bg2);
  border-bottom:1px solid var(--border)}
.txt .tab{height:32px;padding:0 18px;border-radius:4px;
  border:1px solid var(--border);background:var(--bg3);color:var(--fg);
  font-size:13px;font-family:var(--font)}
.txt .tab.on{background:var(--accent);color:var(--bg);
  border-color:var(--accent)}
.txt .grow{flex:1;min-height:0;padding:8px;display:flex}
.txt textarea{flex:1;width:100%;min-height:0;border-radius:4px;
  border:1px solid var(--border);background:var(--bg);color:var(--fg);
  padding:8px;resize:none;
  font:13px/1.55 Consolas,"SF Mono",ui-monospace,monospace}
.txt .bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;
  background:var(--bg2);border-top:1px solid var(--border);
  align-items:center}
.txt .sep{width:1px;height:22px;background:var(--border);margin:0 2px}
/* 保存と取り消しは右端にまとめる。1行に混ぜると、折り返したときに
   片方だけ下へ落ちて見た目が崩れた(2026-10-29 の実測)。 */
.txt .bar.end{justify-content:flex-end;border-top:none;padding-top:0}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cmdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cmdgrid .chip{justify-content:flex-start;font-family:Consolas,ui-monospace,monospace;font-size:12px}
.cmdlist{display:flex;flex-direction:column;gap:4px}
.cmdlist div{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 4px 4px 10px;font-family:Consolas,ui-monospace,monospace;font-size:12px}
.cmdlist span{flex:1}
.tool.on{color:var(--fg);border-color:var(--accent)}
.rot{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;place-items:center;text-align:center;padding:24px;line-height:1.8}
/* 縦のときは、**画面を回してもらう代わりにこちらが回す**
   (利用者の指定 2026-10-24: 横にできないブラウザがあるため)。
   当たり判定はブラウザが回したまま見てくれるが、座標の計算は
   こちらで付け替える(ROT / rotXY)。 */
@media (orientation:portrait) and (max-width:700px){
  .rot{display:none}
  html,body{overflow:hidden}
  /* 回した板の外枠。**見えている分**に合わせる —
     iOS の 100vh は隠れている上下の帯まで入った高さなので、
     そのまま使うと板が画面より大きくなり端が切れる
     (利用者の報告 2026-10-30)。--vv-* は JS が測って渡す。
     渡らなかったときのために dvh/dvw → vh/vw と下がる。 */
  .app{position:fixed;top:50%;left:50%;
    width:100vh;height:100vw;
    width:100dvh;height:100dvw;
    width:var(--vv-h,100dvh);height:var(--vv-w,100dvw);
    transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<script>
(()=>{
"use strict";
/* ===== NeoTJAEditor 作譜ペインの寸法（chart_edit_widget.py / waveform_widget.py の値そのまま） ===== */
const NEO={
  PANE_H:300,          // preview_dock: chart_edit.setFixedHeight(300)
  LANE_X0:130, RULER_H:22,
  ROWS:[["bpm","BPM",30],["measure","拍子記号",30],["note","音符",0],["hs","スクロール",30],["barline","小節線",28],["gogo","GOGO",28]],
  NOTE_R:14, NOTE_R_BIG:19, SPAN_TH:24, SPAN_TH_BIG:34, WAVE_FRAC:.45, LANE_GAIN:3.0, WAVE_BASE_GAIN:3.0,
  WINDOW:6.0/Math.pow(1.25,5),   // WAVEFORM_WINDOW_DEFAULT（秒）
  FOLLOW_FRAC_PLAY:.3, FOLLOW_FRAC:.33, VIEW_MARGIN_FRAC:.25,
  BEAT_FRAC:1.0, SUB_FRAC:.34, GRID_LABEL_X:80, GRID_LABEL_W:46,
  ROW_CONTENT:"#c8c8c8", RING:"#fbf3e0", WAVE:"#9aa3b2",
};
const GRID_CHOICES=[1,2,3,4,6,8,12,16,20,24,32,48,64,96,128,192];
const BEAT_COLOR=[235,235,235];
const GRID_COLORS={4:BEAT_COLOR,8:[70,160,255],12:[175,115,255],16:[255,205,60],24:[255,110,185],32:[90,220,130],48:[255,150,70],64:[110,225,225]};
const PAL={bg:"#0f1117",bg2:"#161b27",border:"#2e3a50",fg:"#cdd6f4",fg_dim:"#6c7a96",err:"#ff6b6b",don:"#ff6b6b",ka:"#5bc8fc"};
const FONT='"Yu Gothic UI","Meiryo UI","Hiragino Sans","Segoe UI",system-ui,sans-serif';

/* ===== 譜面の内部表現: 拍=480刻み（1/20 や 1/192 も割り切れる） ===== */
const TPB=480, TPM=TPB*4;
const TYPES={
  d:{name:"ドン",ch:"1",big:false,don:true},
  k:{name:"カッ",ch:"2",big:false,don:false},
  D:{name:"大ドン",ch:"3",big:true,don:true},
  K:{name:"大カッ",ch:"4",big:true,don:false},
  r:{name:"連打",ch:"5",big:false,long:"roll"},
  R:{name:"大連打",ch:"6",big:true,long:"roll_big"},
  b:{name:"風船",ch:"7",big:false,long:"balloon"},
};
const CMDS={
  BPMCHANGE:{val:true,desc:"BPM を変える",ph:"例 180"},
  MEASURE:{val:"text",desc:"拍子（小節の頭に入ります）",ph:"例 3/4"},
  SCROLL:{val:true,desc:"流れる速さの倍率",ph:"例 1.5"},
  GOGOSTART:{desc:"ゴーゴータイム開始"},
  GOGOEND:{desc:"ゴーゴータイム終了"},
  BARLINEOFF:{desc:"小節線を隠す"},
  BARLINEON:{desc:"小節線を戻す"},
};
const $=id=>document.getElementById(id);

function sample(){
  const n=[],c=[];const put=(m,beat,type)=>n.push({t:m*TPM+Math.round(beat*TPB),type});
  for(let m=0;m<2;m++){put(m,0,"D");put(m,1,"d");put(m,1.5,"k");put(m,2,"d");put(m,3,"k");put(m,3.5,"k");}
  for(let m=2;m<4;m++)for(let i=0;i<8;i++)put(m,i*.5,i%3===2?"k":"d");
  c.push({t:4*TPM,k:"GOGOSTART"});
  for(let m=4;m<6;m++)for(let i=0;i<16;i++)if(i%4!==3)put(m,i*.25,(i%4===1||i%8===6)?"k":"d");
  c.push({t:5*TPM,k:"SCROLL",v:1.5});
  n.push({t:6*TPM,type:"r",end:6*TPM+2*TPB});put(6,3,"K");
  n.push({t:7*TPM,type:"b",end:7*TPM+3*TPB,count:8});
  c.push({t:8*TPM,k:"GOGOEND"});c.push({t:8*TPM,k:"BPMCHANGE",v:180});put(8,0,"D");
  return{title:"サンプル譜面",bpm:150,offset:0,course:"Oni",level:8,notes:n,cmds:c,hdr:{SUBTITLE:"--自由に書き換えてOK",DEMOSTART:"4.8",MAKER:"Ne"},extra:[]};
}
let S;try{const raw=localStorage.getItem("neotja-mobile2");S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!S||!Array.isArray(S.notes))S=sample();
const V={view:-NEO.WINDOW*NEO.FOLLOW_FRAC,span:NEO.WINDOW,grid:16,cur:0,tool:"d",balloon:5,bpmVal:"",hsVal:"1",pending:null,playing:false,pos:0,mode:"edit",big:false};
const hist=[];
function snapShot(){hist.push(JSON.stringify(S));if(hist.length>80)hist.shift()}
function save(){if(CO.on)return;   // 合作中の本文は預かりもの
  try{localStorage.setItem("neotja-mobile2",JSON.stringify(S))}catch(e){}}
function changed(){S.notes.sort((a,b)=>a.t-b.t);S.cmds.sort((a,b)=>a.t-b.t);buildTempo();buildMeasures();save();draw()}

/* ===== 時刻 ===== */
let TEMPO=[];
function buildTempo(){TEMPO=[{t:0,bpm:+S.bpm||120,sec:0}];
  for(const c of S.cmds){if(c.k!=="BPMCHANGE"||!(+c.v>0))continue;const p=TEMPO[TEMPO.length-1];if(c.t<p.t)continue;
    if(c.t===p.t)p.bpm=+c.v;else TEMPO.push({t:c.t,bpm:+c.v,sec:p.sec+(c.t-p.t)/TPB*60/p.bpm})}}

function fit(){const d=bpx(),[bw,bh]=want();

const fmtG=v=>String(+(+v).toPrecision(6));

function gridMeasures(){const m=mIndex(V.cur);return V.playing?[m-1,m,m+1,m+2]:[m,m+1,m+2]}

const CROP={x:LITE.LANE_X,y:140,w:LITE.W-LITE.LANE_X,h:240};
function liteScale(){return Math.min(W/CROP.w,H/CROP.h)}
const ROLL_SPEED=45,ROLL_RED_HITS=10;   // Neo の既定の連打秒速と、真っ赤になる打数
function rollHits(d){return d<=.1?Math.floor(d*60):d<=.15?Math.floor(d*55):Math.floor(d*ROLL_SPEED)}   // tja_analyzer._roll_hits（段階的補正）
function balloonPop(n){const s0=t2s(n.t),s1=t2s(n.end),need=n.count||5;return Math.min(s1,s0+need/ROLL_SPEED)}
// 上の読み出し: 連打は数え上げ、風船は残り打数（_live_top_count）
function liveTopCount(now){for(const n of S.notes){const T=TYPES[n.type];if(!T.long)continue;const s0=t2s(n.t),s1=t2s(n.end);
    if(T.long!=="balloon"){if(s0<=now&&now<=s1){const h=rollHits(s1-s0);return s1<=s0?h:Math.floor(h*(now-s0)/(s1-s0))}}
    else{const pop=balloonPop(n);if(s0<=now&&now<pop)return Math.max(0,(n.count||5)-Math.floor((now-s0)*ROLL_SPEED))}}return null}
const GOGO={ATT:.033,DEC:.267,REL:.10,SHAPE:.7,OPEN_MIN:.16,OPEN_HOLD:2/60,OPEN_RISE:5/60};
function gogoSecs(){return spans("GOGOSTART","GOGOEND").map(([a,b])=>[t2s(a),b==null?Infinity:t2s(b)])}
function gogoRegionAt(now){let r=null;for(const g of gogoSecs()){if(g[0]<=now)r=g;else break}return r}
function gogoPulse(now){const r=gogoRegionAt(now);if(!r)return 0;const [g0,g1]=r,peak=GOGO.ATT+GOGO.DEC;let ft=Math.min(now-g0,peak),over=0;
  if(now>=g1){over=(now-g1)/GOGO.REL;if(over>=1)return 0;ft=Math.min(g1-g0,peak)}
  let v=ft>=GOGO.ATT?1+Math.pow(Math.max(0,1-(ft-GOGO.ATT)/GOGO.DEC),GOGO.SHAPE):2*(ft/GOGO.ATT);v*=.5;if(over>0)v*=1-over*over;return Math.max(0,Math.min(1,v))}
function gogoOpenScale(now){const r=gogoRegionAt(now);if(!r||!(r[0]<=now&&now<=r[1]))return null;const e=now-r[0];
  if(e<GOGO.OPEN_HOLD)return GOGO.OPEN_MIN;const u=(e-GOGO.OPEN_HOLD)/GOGO.OPEN_RISE;return u>=1?1:GOGO.OPEN_MIN+(1-GOGO.OPEN_MIN)*u}
// 直前に判定円を通った音符（再生中だけ）
function recentHit(now){let best=null;for(const n of S.notes){if(TYPES[n.type].long)continue;const s=t2s(n.t),age=now-s;if(age<0)break;if(age<.4)best={age,big:TYPES[n.type].big}}return best}
// 火花（スキン無しなので自前の絵）: 金色の輪が広がり、細い光の筋が飛ぶ
function drawSpark(x,y,age,big){const D=.26;if(age>=D)return;const q=age/D,R=(big?78:62)*(.55+.6*q);
  p.save();p.globalCompositeOperation="lighter";p.globalAlpha=1-q;
  const g=p.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,"rgba(255,240,180,.9)");g.addColorStop(.45,"rgba(255,170,40,.55)");g.addColorStop(1,"rgba(255,90,0,0)");
  p.fillStyle=g;p.beginPath();p.arc(x,y,R,0,7);p.fill();
  p.strokeStyle="rgba(255,220,120,1)";p.lineWidth=3;p.lineCap="round";
  for(let i=0;i<10;i++){const a=i*Math.PI/5+.3,r0=R*.45,r1=R*(.8+.25*((i*7)%3)/2);p.beginPath();p.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);p.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);p.stroke()}
  p.restore()}
function drawLite(){
  syncNav();p.fillStyle="#000";p.fillRect(0,0,W,H);
  const L=liteScale(),ox=(W-CROP.w*L)/2,oy=(H-CROP.h*L)/2;
  p.save();p.translate(ox-CROP.x*L,oy-CROP.y*L);p.scale(L,L);
  const now=V.playing?V.pos:t2s(V.cur),lw=LITE.LANE_W,top=0,bh=LITE.LANE_H,mid=bh/2,jx=LITE.JUDGE_X;
  p.translate(LITE.LANE_X,LITE.LANE_Y);p.beginPath();p.rect(0,0,lw,bh);p.clip();
  p.fillStyle=LITE.surface;p.fillRect(0,0,lw,bh);
  const nowT=s2t(Math.max(0,now));
  const gs=gogoOpenScale(now);if(gs!=null){const oh=bh*gs;p.fillStyle=LITE.gogo;p.fillRect(0,mid-oh/2,lw,oh)}
  p.strokeStyle=LITE.border;p.lineWidth=2;line(0,1,lw,1);line(0,bh-1,lw,bh-1);line(lw-1,0,lw-1,bh);
  p.setLineDash([4,4]);p.lineWidth=1;line(0,Math.floor(mid)+.5,lw,Math.floor(mid)+.5);p.setLineDash([]);
  const xOf=(t,base)=>jx+(t2s(t)-now)*speedAt(base==null?t:base);
  // 小節線
  const hidden=spans("BARLINEOFF","BARLINEON");p.strokeStyle=LITE.fg_dim;p.lineWidth=2;
  p.font="16px "+FONT;p.textBaseline="top";
  for(let m=0;m<=known();m++){const t=mStart(m);if(hidden.some(([a,b])=>t>=a&&(b==null||t<b)))continue;const x=xOf(t);if(x<-8||x>lw+8)continue;line(Math.floor(x),0,Math.floor(x),bh);
    if(m<known()){p.fillStyle=LITE.fg_dim;p.fillText(String(m+1),Math.floor(x)+4,6)}}
  // 判定円
  p.strokeStyle=LITE.bright;p.lineWidth=3;p.beginPath();p.arc(jx,mid,LITE.RING,0,7);p.stroke();p.beginPath();p.arc(jx,mid,LITE.RING_IN,0,7);p.stroke();
  // ゴーゴーの入り: 判定円が赤く脈打つ（Neo の gogo_pulse と同じ ADSR）
  const ge=gogoPulse(now);if(ge>0){const gr=LITE.RING+4+11*ge;
    p.globalAlpha=.18+.55*ge;p.strokeStyle=PAL.don;p.lineWidth=2+5*ge;p.beginPath();p.arc(jx,mid,gr,0,7);p.stroke();
    p.globalAlpha=.30+.60*ge;p.lineWidth=3;p.beginPath();p.arc(jx,mid,LITE.RING,0,7);p.stroke();p.globalAlpha=1}
  // 音符（時間の遅いものから描いて、早いものを手前へ）
  const objs=S.notes.slice().sort((a,b)=>b.t-a.t);
  for(const n of objs){const T=TYPES[n.type],x=xOf(n.t);
    if(T.long==="balloon"){
      // 風船: 終点のバーは無し。流れてきて、区間中は判定枠に止まり、叩ききった時刻（打数 ÷ 連打秒速）で割れて消える
      const s0=t2s(n.t),pop=balloonPop(n);if(now>=pop)continue;
      const bx=now>=s0?jx:x;if(bx>lw+60)continue;
      p.beginPath();p.arc(bx,mid,LITE.R,0,7);p.fillStyle=LITE.balloon;p.fill();p.lineWidth=2;p.strokeStyle=LITE.bright;p.stroke();continue}
    if(T.long){
      // 連打: 頭と尻はそれぞれの時刻の速さで置く。帯は頭・胴・尻の同じ色の丸、輪は頭だけ。叩き込むほど赤へ
      const xe=jx+(t2s(n.end)-now)*speedAt(n.end);if((x<-60&&xe<-60)||(x>lw+60&&xe>lw+60))continue;const r=T.big?LITE.RB:LITE.R;
      const s0=t2s(n.t),s1=t2s(n.end);let heat=0;if(now>=s1)heat=1;else if(now>s0){const hits=rollHits(s1-s0);heat=Math.min(1,hits*(now-s0)/(s1-s0)/ROLL_RED_HITS)}
      const c0=[255,209,102],c1=[255,107,107],col=`rgb(${c0.map((v,i)=>Math.round(v+(c1[i]-v)*heat)).join(",")})`;
      p.fillStyle=col;p.beginPath();p.arc(x,mid,r,0,7);p.fill();p.fillRect(Math.min(x,xe),mid-r,Math.abs(xe-x),r*2);p.beginPath();p.arc(xe,mid,r,0,7);p.fill();
      p.lineWidth=2;p.strokeStyle=LITE.bright;p.beginPath();p.arc(x,mid,r,0,7);p.stroke();continue}
    if(V.playing&&t2s(n.t)<=now)continue;   // 叩いた音符は消える
    if(x<-60||x>lw+60)continue;liteNote(x,mid,T.big?LITE.RB:LITE.R,T.don?PAL.don:PAL.ka)}
  const hit=V.playing?recentHit(now):null;
  if(hit)drawSpark(jx,mid,hit.age,hit.big);
  p.restore();
  const rc=V.playing?liveTopCount(now):null;
  if(rc!=null){p.save();p.translate(ox-CROP.x*L,oy-CROP.y*L);p.scale(L,L);p.fillStyle=LITE.roll;p.font="bold 30px "+FONT;p.textBaseline="middle";
    p.fillText(String(rc),LITE.LANE_X+jx+LITE.RB+5+8,LITE.LANE_Y-28);p.restore()}
  // 「良」はレーンの上へはみ出して出す（JUDGE_BOTTOM = レーン上端 + 15）
  if(hit&&hit.age<.36){p.save();p.translate(ox-CROP.x*L,oy-CROP.y*L);p.scale(L,L);
    const a=hit.age/.36,y=LITE.LANE_Y+15-6*Math.min(1,a*3);p.globalAlpha=a<.7?1:1-(a-.7)/.3;
    p.font="bold 40px "+FONT;p.textAlign="center";p.textBaseline="bottom";p.lineJoin="round";p.lineWidth=6;p.strokeStyle="#3a1d00";
    p.strokeText("良",LITE.LANE_X+jx,y);p.fillStyle="rgb(255,206,70)";p.fillText("良",LITE.LANE_X+jx,y);p.restore()}
  // 時刻（画面の左下に小さく）
  p.fillStyle=PAL.fg_dim;p.font="12px "+FONT;p.textBaseline="bottom";p.textBaseline="top";p.fillText(timeText(now)+"  小節 "+(mIndex(nowT)+1),ox+8,oy+CROP.h*L+6>H-18?6:oy+CROP.h*L+6);
}

/* ===== 操作 ===== */
function snapTick(sec){const t=Math.max(0,s2t(Math.max(0,sec))),m=mIndex(t),mg=mGrid(m);
  const k=Math.round((t-mStart(m))/mLen(m)*mg);return slotTick(m,k)}
function rowAt(y){if(y<G.RH)return"ruler";for(const [kind] of NEO.ROWS){const [ry,rh]=G.rows[kind];if(y>=ry&&y<ry+rh)return kind}return null}
let P=null;
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();cv.setPointerCapture(e.pointerId);
  const[lx,ly]=rotXY(e,r);
  P={x:e.clientX,y:ly,lx:lx,view:V.view,drag:false,sec0:t2s(V.cur),cur0:V.cur}});
cv.addEventListener("pointermove",e=>{if(!P)return;const dx=rotDX(e,P);if(Math.abs(dx)>8)P.drag=true;
  if(!P.drag||V.playing)return;
  if(V.mode==="preview"){const L=liteScale(),sec=Math.max(0,P.sec0-dx/(L*speedAt(P.cur0)));V.cur=snapTick(sec);draw();return}
  V.view=P.view-dx/G.xs;draw()});
cv.addEventListener("pointerup",()=>{if(!P)return;const q=P;P=null;if(q.drag)return;if(V.mode==="preview"){if(!V.playing)stepMeasure(q.lx<W/2?-1:1);return}tap(q.lx,q.y)});
cv.addEventListener("pointercancel",()=>P=null);
cv.addEventListener("wheel",e=>{e.preventDefault();if(V.playing||V.mode==="preview")return;V.view+=(e.deltaX||e.deltaY)/G.xs;draw()},{passive:false});

function tap(x,y){
  closePicker();
  if(x<G.X0){if(y<G.RH&&x>=NEO.GRID_LABEL_X*K&&x<=(NEO.GRID_LABEL_X+NEO.GRID_LABEL_W)*K)openPicker();return}
  if(V.playing)return;
  const row=rowAt(y),t=snapTick(xs2sec(x));
  // レーンのタップはカーソル移動だけ（置くのは左の音符ボタン）
  V.cur=t;draw();
}
function nearCmd(x,ks){let best=null,bd=12*K;for(const c of S.cmds){if(!ks.includes(c.k))continue;const d=Math.abs(sx(t2s(c.t))-x);if(d<bd){bd=d;best=c}}return best}
function hitNote(x){let best=null,bd=1e9;
  for(const n of S.notes){const T=TYPES[n.type],nx=sx(t2s(n.t)),r=(T.long?(NEO.SPAN_TH_BIG/2+3):(T.big?NEO.NOTE_R_BIG:NEO.NOTE_R))*K+3;
    if(T.long&&x>=nx-r&&x<=sx(t2s(n.end))){const d=Math.abs(x-nx)*.01;if(d<bd){bd=d;best=n}continue}
    const d=Math.abs(x-nx);if(d<=r&&d<bd){bd=d;best=n}}return best}
function tapNote(x,t){
  if(V.pending){const pd=V.pending;V.pending=null;if(t<=pd.t){toast("終点は始点より後ろにしてください");draw();return}
    snapShot();const n={t:pd.t,type:pd.type,end:t};if(pd.type==="b")n.count=V.balloon;S.notes.push(n);V.cur=t;changed();return}
  const hit=hitNote(x);
  if(hit){snapShot();if(V.tool==="erase"||hit.type===V.tool||TYPES[hit.type].long||TYPES[V.tool].long)S.notes.splice(S.notes.indexOf(hit),1);else hit.type=V.tool;
    V.cur=hit.t;changed();return}
  V.cur=t;if(V.tool==="erase"){draw();return}
  if(S.notes.some(n=>TYPES[n.type].long&&t>n.t&&t<=n.end)){toast("連打の途中には置けません");draw();return}
  if(TYPES[V.tool].long){V.pending={t,type:V.tool};draw();return}
  snapShot();S.notes.push({t,type:V.tool});changed();
}
let tt=0;function toast(m){const el=$("toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1500)}

let picker=null;
function openPicker(){closePicker();picker=document.createElement("div");picker.className="picker";
  for(const g of GRID_CHOICES){const b=document.createElement("button");b.textContent="1/"+g;b.setAttribute("aria-pressed",g===V.grid);
    b.onclick=()=>{V.grid=g;closePicker();syncGrid();draw()};picker.appendChild(b)}
  picker.style.left=Math.max(2,NEO.GRID_LABEL_X*K-6)+"px";picker.style.top=(G.RH+2)+"px";$("pane").appendChild(picker)}

function buildPal(){const el=$("pal");el.textContent="";if(V.mode!=="preview")return buildLeft();
  if(V.mode==="preview"){el.innerHTML=`<div class="nav">
    <button class="chip" id="nFirst" aria-label="先頭へ">|◀</button><button class="chip" id="nPrev">◀ 前の小節</button>
    <span class="mno" id="nNo"></span>
    <button class="chip" id="nNext">次の小節 ▶</button>
    <input type="range" id="nBar" min="1" max="1" step="1" aria-label="小節を選ぶ"></div>`;
    $("nFirst").onclick=()=>gotoMeasure(0);$("nPrev").onclick=()=>stepMeasure(-1);$("nNext").onclick=()=>stepMeasure(1);
    $("nBar").oninput=e=>gotoMeasure(+e.target.value-1);syncNav();return}
}

function setMode(m){V.mode=m;V.pending=null;closePicker();const b=$("tMode");
  b.innerHTML=ICON.mode+"<small>"+(m==="preview"?"作譜へ":"プレビュー")+"</small>";b.classList.toggle("on",m==="preview");

$("tMode").onclick=()=>setMode(V.mode==="preview"?"edit":"preview");
function gotoMeasure(m){if(V.playing)stop();V.cur=mStart(Math.max(0,Math.min(known()-1,m)));V.view=t2s(V.cur)-V.span*NEO.FOLLOW_FRAC;draw()}
function stepMeasure(d){const m=mIndex(V.cur);if(d<0&&V.cur>mStart(m))gotoMeasure(m);else gotoMeasure(m+d)}
function syncNav(){if(V.mode!=="preview"||!$("nNo"))return;const n=known(),m=mIndex(Math.max(0,V.playing?s2t(V.pos):V.cur))+1;
  $("nNo").textContent=`小節 ${m} / ${n}`;const r=$("nBar");r.max=n;if(document.activeElement!==r)r.value=m}

let cmdSel="SCROLL";

  if(CO.on)for(const [id,what] of [["cmIns","ins"],["cmDup","dup"],["cmDel","del"]])

    document.querySelectorAll("#cGrid .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===cmdSel))};
  document.querySelectorAll("#cGrid .chip").forEach(b=>b.onclick=()=>{cmdSel=b.dataset.k;$("cVal").value="";sync()});

    snapShot();S.cmds.splice(S.cmds.indexOf(c),1);changed();openCmdSheet()});
  $("cAdd").onclick=()=>{

    if(cmdSel==="MEASURE"){const raw=$("cVal").value.trim();if(!parseSig(raw)){toast("3/4 のように入れてください");return}

    snapShot();S.cmds=S.cmds.filter(c=>!(c.t===V.cur&&c.k===cmdSel));S.cmds.push(o);changed();toast("#"+cmdSel+" を追加しました");closeSheet()};
  $("cClose").onclick=closeSheet;sync()}

/* ===== 左手: 音符ボタン（カーソルの位置に置く） ===== */
function buildLeft(){if(V.mode==="preview")return;const pal=$("pal");pal.textContent="";
  const el=document.createElement("div");el.className="notes";pal.appendChild(el);
  const add=(html,cls,fn,label)=>{const b=document.createElement("button");b.className="chip"+(cls?" "+cls:"");b.innerHTML=html;b.onclick=fn;if(label)b.setAttribute("aria-label",label);el.appendChild(b);return b};
  for(const k of ["d","k","r","b"]){const T=TYPES[k];
    const icon=T.long?`<i class="bar" style="background:${T.long==="balloon"?"#ff9f43":"#fcdb38"}"></i>`:`<i class="dot" style="background:${T.don?PAL.don:PAL.ka}"></i>`;
    const armed=V.pending&&(V.pending.type===k||(k==="r"&&V.pending.type==="R"));
    add(icon+(armed?"終点":T.name),armed?"armed":"",()=>place(armed?V.pending.type:k))}
  add("大↔小","",toggleSize,"カーソルの音符の大きさを切り替え");
  add("消去","",()=>place("erase"));
  add('<b style="font-family:Consolas,monospace">#</b>命令',"",()=>openCmdSheet());
  const mv=document.createElement("div");mv.className="mv";
  mv.innerHTML='<button id="cPrev" aria-label="カーソルを1つ前へ">◀</button><button id="cNext" aria-label="カーソルを1つ後ろへ">▶</button>';pal.appendChild(mv);
  repeatBtn("cPrev",()=>moveCursor(-1));repeatBtn("cNext",()=>moveCursor(1));
}
// カーソルの位置の音符を大⇔小に切り替える（ドン・カッ・連打。風船は大小が無い）
// 風船を置いたら毎回打数を聞く
function askBalloon(n){openSheet(`<h2>風船の打数</h2>
  <div class="row"><input id="bN" type="number" inputmode="numeric" min="1" value="${n.count||5}" style="flex:1;height:44px;font-size:20px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--fg);padding:0 10px">
  <button class="btn pri" id="bOk" style="height:44px">決定</button></div>`);
  const inp=$("bN");setTimeout(()=>{inp.focus();inp.select()},50);
  const ok=()=>{if(coRO())return;const v=parseInt(inp.value);if(!(v>0)){toast("1 以上の数を入れてください");return}n.count=v;V.balloon=v;closeSheet();changed()};
  $("bOk").onclick=ok;inp.addEventListener("keydown",e=>{if(e.key==="Enter")ok()})}
function toggleSize(){
  if(CO.on){if(!coCanWrite())return;
    if(V.playing)stop();coSizeOp();return}
  if(V.playing)stop();const FLIP={d:"D",D:"d",k:"K",K:"k",r:"R",R:"r"};
  const n=S.notes.find(n=>n.t===V.cur)||S.notes.find(n=>TYPES[n.type].long&&V.cur>n.t&&V.cur<=n.end);
  if(!n){toast("カーソルの位置に音符がありません");return}
  if(!FLIP[n.type]){toast("風船は大小がありません");return}
  snapShot();n.type=FLIP[n.type];changed();toast(TYPES[n.type].name+" にしました")}
function place(type){
  if(CO.on){
    if(!coCanWrite())return;
    if(V.playing)stop();
    if(type==="erase")coDelOp();
    else if(TYPES[type].long)coLongOp(type);
    else coKeyOp(type);
    return}
  if(V.playing)stop();const t=V.cur;
  if(type==="erase"){V.pending=null;const n=S.notes.find(n=>n.t===t)||S.notes.find(n=>TYPES[n.type].long&&t>n.t&&t<=n.end);
    if(!n){toast("ここに音符はありません");buildLeft();draw();return}snapShot();S.notes.splice(S.notes.indexOf(n),1);changed();buildLeft();return}
  const T=TYPES[type];
  if(V.pending){const pd=V.pending;V.pending=null;
    if(pd.type===type){if(t<=pd.t){toast("終点は始点より後ろへ動かしてください");V.pending=pd;return}
      snapShot();const n={t:pd.t,type,end:t};if(type==="b")n.count=V.balloon;S.notes=S.notes.filter(x=>!(x.t>pd.t&&x.t<=t));S.notes.push(n);changed();buildLeft();
      if(type==="b")askBalloon(n);return}
    toast("連打の入力をやめました")}
  if(S.notes.some(n=>TYPES[n.type].long&&t>n.t&&t<=n.end)){toast("連打の途中には置けません");buildLeft();draw();return}
  const hit=S.notes.find(n=>n.t===t);
  if(T.long){if(hit&&hit.type===type){snapShot();S.notes.splice(S.notes.indexOf(hit),1);changed();buildLeft();return}
    V.pending={t,type};toast("カーソルを終点まで動かして、もう一度「"+T.name+"」");buildLeft();draw();return}
  snapShot();
  if(hit){if(hit.type===type)S.notes.splice(S.notes.indexOf(hit),1);else{S.notes.splice(S.notes.indexOf(hit),1);S.notes.push({t,type})}}
  else S.notes.push({t,type});
  changed();buildLeft();
}

function moveCursor(d){if(V.playing)stop();const m=mIndex(V.cur),mg=mGrid(m),f=(V.cur-mStart(m))/mLen(m)*mg;
  let k=d>0?Math.floor(f+1e-6)+1:Math.ceil(f-1e-6)-1;
  if(k<0){if(m===0){V.cur=0}else{const pm=m-1;V.cur=slotTick(pm,mGrid(pm)-1)}}else V.cur=slotTick(m,k);   // k=mg は次の小節の頭
  follow();draw()}
function moveMeasure(d){if(V.playing)stop();const m=mIndex(V.cur);

let txtDirty=false;

function txtSave(){
  const r=importTJA($("tTxt").value);
  if(!r){toast("#START が見つかりませんでした");return false}
  snapShot();

        +(r.skipped?("・未対応の命令 "+r.skipped+" 個"):""));
  return true}
/* 命令を1行として入れる。**カーソルのある行の手前**へ置く —
   行の途中に差し込むと小節が壊れるため。値が要るものは数字だけ
   選んだ状態にして、すぐ打ち替えられるようにする。 */
function txtCmd(name){
  const ta=$("tTxt"),info=CMDS[name]||{};
  let val="";
  if(info.val)val=name==="MEASURE"?"4/4"
    :name==="BPMCHANGE"?String(+S.bpm||120):"1";
  const line="#"+name+(val?(" "+val):"");
  const v=ta.value,p=ta.selectionStart;
  const ls=v.lastIndexOf("\n",Math.max(0,p-1))+1;
  ta.focus();ta.setSelectionRange(ls,ls);
  // execCommand で入れると、ブラウザ自身の「元に戻す」に残る。
  let done=false;
  try{done=document.execCommand("insertText",false,line+"\n")}
  catch(e){done=false}
  if(!done)ta.setRangeText(line+"\n",ls,ls,"end");
  txtDirty=true;
  if(val){const a=ls+line.length-val.length;
    ta.setSelectionRange(a,a+val.length)}
  else ta.setSelectionRange(ls+line.length+1,ls+line.length+1);
  ta.focus()}
function txtEdit(cmd){
  $("tTxt").focus();
  try{document.execCommand(cmd)}catch(e){}
  txtDirty=true}

/* ===== 音源を端末に覚えておく（次に開いたときも読み込まれた状態にする） ===== */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("neotja-mobile",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function kvSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");v==null?tx.objectStore("kv").delete(k):tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function kvGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction("kv").objectStore("kv").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
function rememberAudio(){kvSet("audio",AUD.bytes?{name:AUD.name,bytes:AUD.bytes.slice(0),fromHost:!!AUD.fromHost}:null)}
async function restoreAudio(){const a=await kvGet("audio");if(!a||!a.bytes||AUD.bytes)return;
  try{AUD.bytes=a.bytes.slice(0);AUD.buf=await actx().decodeAudioData(a.bytes.slice(0));AUD.name=a.name;AUD.fromHost=!!a.fromHost;AUD.raw=null;buildPeaks();draw()}catch(e){AUD.bytes=null}}

/* ===== ZIP（.tja と .ogg を同封） ===== */
const AUDIO_RE=/\.(ogg|mp3|wav|m4a|opus)$/i;
function decodeTJA(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,"")}catch(_){return new TextDecoder("shift_jis").decode(buf)}}
async function loadPackage(file){
  if(coRO())return;
  closeSheet();toast("読み込み中…");
  try{
    let tjaText=null,audioFile=null,audioName="";
    if(/\.tja$/i.test(file.name)){tjaText=decodeTJA(await file.arrayBuffer())}
    else{
      if(!window.JSZip){toast("ZIP を開く部品が読み込めませんでした");return}
      const zip=await JSZip.loadAsync(file),names=Object.keys(zip.files).filter(n=>!zip.files[n].dir&&!/(^|\/)__MACOSX\//.test(n));
      const tjaName=names.find(n=>/\.tja$/i.test(n));if(!tjaName){toast("ZIP の中に .tja が見つかりません");return}
      tjaText=decodeTJA(await zip.file(tjaName).async("arraybuffer"));
      const wave=(tjaText.match(/^\s*WAVE:(.*)$/mi)||[])[1];const base=n=>n.split("/").pop();
      const an=(wave&&names.find(n=>base(n).toLowerCase()===wave.trim().toLowerCase()))||names.find(n=>/\.ogg$/i.test(n))||names.find(n=>AUDIO_RE.test(n));
      if(an){audioFile=await zip.file(an).async("arraybuffer");audioName=base(an)}
    }
    const r=importTJA(tjaText);if(!r){toast(".tja に #START がありません");return}
    snapShot();S=r.state;V.cur=0;V.view=-V.span*NEO.FOLLOW_FRAC;V.pending=null;
    AUD.buf=null;AUD.peaks=null;AUD.bytes=null;AUD.name="";
    AUD.fromHost=false;AUD.raw=null;
    if(audioFile){AUD.bytes=audioFile.slice(0);try{AUD.buf=await actx().decodeAudioData(audioFile);AUD.name=audioName;buildPeaks()}catch(e){toast(audioName+" を再生できる形に読めませんでした")}}
    changed();buildLeft();rememberAudio();
    toast((AUD.name?"譜面と "+AUD.name+" を読み込みました":"譜面を読み込みました（音源なし）")+(r.skipped?`・未対応の命令 ${r.skipped} 個`:""));
  }catch(e){toast("読み込めませんでした: "+(e&&e.message||e))}
}
function encodeTJA(text){
  // Neo と同じく cp932（Shift_JIS）で書く。表せない文字があれば UTF-8 にする
  const crlf=text.replace(/\n/g,"\r\n");
  if(window.Encoding){const codes=Encoding.convert(Encoding.stringToCode(crlf),{to:"SJIS",from:"UNICODE"});
    const back=Encoding.codeToString(Encoding.convert(codes,{to:"UNICODE",from:"SJIS"}));
    if(back===crlf)return{data:new Uint8Array(codes),enc:"cp932"}}
  return{data:new TextEncoder().encode("\uFEFF"+crlf),enc:"UTF-8"}
}
/* 普通の web(GitHub Pages など)でのファイル保存。<a download> を
   押したことにする。download を見ない古い入れ物では新しい窓で
   開いて、長押しで保存できるようにしておく。 */
function saveBlob(name,blob){
  try{
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;a.rel="noopener";
    if(!("download" in a))a.target="_blank";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    return true}
  catch(e){return false}
}
async function savePackage(){
  closeSheet();if(!window.JSZip){toast("ZIP を作る部品が読み込めませんでした");return}
  const H=hdr(),safe=(S.title||"譜面").replace(/[\\/:*?"<>|]/g,"_").trim()||"譜面";
  /* 合作でもらった音源は、ホストが**鳴る形へ作り直したもの**かもしれない。
     そのまま WAVE: の名前(.ogg)で詰めると、名前と中身が食い違う。
     保存のときだけ元ファイルを頼む(利用者の指定 2026-10-24)。 */
  let bytes=AUD.bytes,aname=AUD.name,lost=false;
  if(bytes&&AUD.fromHost){
    const r=await coSongRawAsk();
    if(r&&r.bytes){bytes=r.bytes;aname=r.name}else{lost=true}}
  let audioName=bytes?(H.WAVE||aname||safe+".ogg"):"";
  // もらえなかったら、せめて**中身どおりの拡張子**にして嘘をつかない。
  if(audioName&&lost){const m=/\.[A-Za-z0-9]+$/.exec(aname||"");
    if(m&&audioName.slice(-m[0].length).toLowerCase()!==m[0].toLowerCase())
      audioName=audioName.replace(/\.[^.]*$/,"")+m[0]}
  if(audioName&&audioName!==H.WAVE)H.WAVE=audioName;
  const {data,enc}=encodeTJA(exportTJA()),zip=new JSZip();zip.file(safe+".tja",data);
  if(bytes)zip.file(audioName,bytes);
  const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE"});
  const msg=(bytes?"":"音源なしで ")+safe+".zip を保存しました"
    +(lost?"（元の音源をもらえなかったので "+audioName+" で入れました）":"")
    +(enc==="UTF-8"?"（cp932 に無い文字があったので UTF-8）":"");
  // Claude の中にいるときだけ専用の口がある。無ければ普通の方へ。
  let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:safe+".zip",data:blob});toast(msg)}
    catch(e){if(e&&e.code!=="declined")toast("保存できませんでした（"+(e&&e.code||"不明")+"）")}
    return}
  if(saveBlob(safe+".zip",blob))toast(msg);
  else toast("この入れ物ではファイルを保存できません");
}

/* ===== TJA 入出力 ===== */
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function exportTJA(){
  const nM=known(),balloons=S.notes.filter(n=>n.type==="b").map(n=>n.count||5);
  const H=hdr(),opt=k=>H[k]?[`${k}:${H[k]}`]:[];
  const head=[`TITLE:${S.title||""}`,...opt("SUBTITLE"),`BPM:${S.bpm}`,`WAVE:${H.WAVE||AUD.name||""}`,`OFFSET:${S.offset}`,
    ...opt("DEMOSTART"),...opt("SONGVOL"),...opt("SEVOL"),...opt("GENRE"),...opt("MAKER"),...S.extra.map(([k,v])=>`${k}:${v}`)];
  const own=Array.isArray(S.own)?S.own:[];
  const out=[`COURSE:${S.course}`,`LEVEL:${S.level}`,...own.map(([k,v])=>`${k}:${v}`)];
  if(balloons.length)out.push(`BALLOON:${balloons.join(",")}`);out.push("","#START");
  for(let m=0;m<nM;m++){const s=mStart(m),e=mStart(m+1),ML_=e-s,ev=[];
    for(const n of S.notes){if(n.t>=s&&n.t<e)ev.push([n.t-s,TYPES[n.type].ch]);if(n.end!=null&&n.end>=s&&n.end<e)ev.push([n.end-s,"8"])}
    const cm=S.cmds.filter(c=>c.t>=s&&c.t<e).sort((a,b)=>a.t-b.t||(a.k==="MEASURE"?-1:b.k==="MEASURE"?1:0));let g=ML_;for(const [q] of ev)g=gcd(g,q);for(const c of cm)g=gcd(g,c.t-s);
    const N=ML_/g,arr=new Array(N).fill("0");for(const [q,ch] of ev)arr[q/g]=ch;
    let idx=0;for(const c of cm){const q=(c.t-s)/g;if(q>idx){out.push(arr.slice(idx,q).join(""));idx=q}out.push("#"+c.k+(CMDS[c.k].val&&c.v!=null?" "+c.v:""))}
    out.push(arr.slice(idx).join("")+",")}
  out.push("#END");
  // 読まなかったコースを同じ場所へ戻す。
  const others=Array.isArray(S.others)?S.others:[],at=Math.max(0,Math.min(others.length,S.at|0));
  const trim=s=>String(s).replace(/\s+$/,"");
  const all=others.slice(0,at).map(o=>trim(o.text)).concat([out.join("\n")],
    others.slice(at).map(o=>trim(o.text))).filter(s=>s.length);
  return head.join("\n")+"\n\n"+all.join("\n\n")+"\n";
}
/* ===== 本文をコースの塊に割る(ほかのコースを失わないため) =====
   利用者の報告 2026-10-23。単体で3コースの譜面を読むと、読まなかった
   2コースが書き出しで跡形もなく消えていた。読むのは今のコースだけに
   しておいて、ほかのコースは**本文のまま預かり**、書き出しで同じ場所へ
   戻す。戻りの blocks は書き出しの並び。body はその塊が #START を持つか。 */
function splitCourses(text){
  const lines=text.replace(/\r/g,"").split("\n"),marks=[];
  let inBody=false,fresh=true;
  for(let i=0;i<lines.length;i++){
    const l=lines[i].split("//")[0].trim();
    if(/^#START\b/i.test(l)){if(fresh){marks.push(i);fresh=false}inBody=true;continue}
    if(/^#END\b/i.test(l)){inBody=false;fresh=true;continue}
    if(inBody||!fresh)continue;
    const m=l.match(/^([A-Za-z0-9]+):/);if(!m)continue;
    const k=m[1].toUpperCase();
    if(k==="COURSE"||PER_COURSE.has(k)){marks.push(i);fresh=false}}
  const top=marks.length?marks[0]:lines.length;
  let gc=null;
  for(let i=0;i<top;i++){const m=lines[i].split("//")[0].trim().match(/^COURSE:(.*)$/i);if(m){gc=m[1];break}}
  const blocks=marks.map((s,j)=>{
    const seg=lines.slice(s,j+1<marks.length?marks[j+1]:lines.length);
    let key=null,level=null,body=false;
    for(const raw of seg){const l=raw.split("//")[0].trim();
      if(/^#START\b/i.test(l)){body=true;break}
      let m=l.match(/^COURSE:(.*)$/i);if(m){key=m[1];continue}
      m=l.match(/^LEVEL:(.*)$/i);if(m)level=parseInt(m[1])||null}
    const text=seg.join("\n");
    return{key:courseKeyOf(key!=null?key:gc),level:level,body:body,
      branch:/^[ \t]*#BRANCHSTART/im.test(text),text:text}});
  return{head:lines.slice(0,top),blocks:blocks}}

/* 譜面に入っているコースを書き出しの並びで並べる。mine が今開いているもの、
   bi は importTJA に渡す番号(本文を持たない塊は -1)。 */
function courseList(){
  const others=Array.isArray(S.others)?S.others:[],at=Math.max(0,Math.min(others.length,S.at|0));
  const all=others.slice(0,at).map(o=>Object.assign({},o))
    .concat([{mine:true,key:S.course,level:S.level,body:true}])
    .concat(others.slice(at).map(o=>Object.assign({},o)));
  let bi=0;
  for(const b of all)b.bi=(b.mine||b.body)?bi++:-1;
  return all}

/* その番号のコースに分岐があるか。あるものは開かない(壊すので)。 */
function branchyAt(text,bi){
  const sc=scanCourses(text),c=sc.courses[bi];if(!c)return false;
  for(let i=c.from;i<c.to;i++)
    if(/^\s*#BRANCHSTART/i.test(sc.lines[i].split("//")[0]))return true;
  return false}

/* コースの切り替え。今のコースをいったん本文へ戻してから、相手を読む。 */
function switchCourse(bi){
  if(coRO())return;
  const tgt=courseList().find(c=>c.bi===bi);
  if(tgt&&tgt.branch){toast("分岐のあるコースは、試作版では開けません（預かったままにします）");return}
  const r=importTJA(exportTJA(),bi);
  if(!r){toast("そのコースを読めませんでした");return}
  snapShot();S=r.state;V.pending=null;V.cur=0;V.view=-V.span*NEO.FOLLOW_FRAC;
  closeSheet();buildLeft();changed();
  toast(S.course+" ★"+S.level+" に切り替えました")}
/* ===== 分岐の系統の追い方 =====
   Neo の note_edit.measure_spans と**同じ順で**追う。name には行の
   命令の名前(大文字)を渡す。戻り true はその行が系統の切り替えで、
   命令としては扱わない、という意味。
   level が 'N'/'E'/'M' ならその系統で固定、'auto' なら path(区間ごとの
   系統の並び)に沿う。どちらでもなければ分岐を見ない(全部数える)。 */
const BRANCH_LEVELS=["N","E","M"];
function branchState(level,path){
  const auto=(level==="auto");
  let want=auto?null:(BRANCH_LEVELS.indexOf(level)>=0?level:null);
  const blind=(!auto&&!want);
  let active=true,sec=-1;
  return{
    blind:blind,
    active(){return blind?true:active},
    line(name){
      if(blind)return false;
      if(name==="BRANCHSTART"){sec++;if(auto)want=(path&&path[sec])||"N";
        active=true;return true}
      if(name==="BRANCHEND"){active=true;return true}
      if(BRANCH_LEVELS.indexOf(name)>=0){active=(name===want);return true}
      return false}}}

/* その系統の風船の数。BALLOONNOR / BALLOONEXP / BALLOONMAS があれば
   そちらを使う(本家と同じ)。無ければ BALLOON。 */
function balloonsFor(head,level){
  const k={N:"BALLOONNOR",E:"BALLOONEXP",M:"BALLOONMAS"}[level];
  const v=(k&&head[k])||head.BALLOON||"";
  return String(v).split(/[,\s]+/).map(x=>parseInt(x)).filter(x=>x>0)}
function importTJA(text,want,branch){
  // want("Oni" など)があればそのコースを読む。無ければ最初のコース。
  // 譜面ぜんたいの見出しと、そのコースだけの見出し(LEVEL/BALLOON ほか)は
  // scanCourses が分けて持ってくる。
  const sc=scanCourses(text),lines=sc.lines;
  if(!sc.courses.length)return null;
  let pick=null;
  if(typeof want==="number")pick=sc.courses[want]||null;
  else if(want)pick=sc.courses.find(c=>c.key===courseKeyOf(want))||null;
  if(!pick)pick=sc.courses[0];
  const pi=sc.courses.indexOf(pick);
  const Hd=pick.head;
  const st={title:Hd.TITLE||"無題",bpm:parseFloat(Hd.BPM)||120,offset:parseFloat(Hd.OFFSET)||0,
    course:courseKeyOf(Hd.COURSE),level:parseInt(Hd.LEVEL)||1,notes:[],cmds:[],hdr:{},extra:[],own:[],others:[],at:0};
  const OWN=new Set(["TITLE","BPM","OFFSET","COURSE","LEVEL","BALLOON",...SONG_KEYS.map(k=>k[0])]);
  // コースだけに効く見出し(SCOREINIT ほか)は own へ。extra に混ぜると
  // 書き出しで譜面ぜんたいの見出しへ移ってしまう。
  for(const [k,v] of Object.entries(Hd)){if(SONG_KEYS.some(x=>x[0]===k)){if(v)st.hdr[k]=v}
    else if(OWN.has(k))continue;else if(PER_COURSE.has(k))st.own.push([k,v]);else st.extra.push([k,v])}
  // いま流している系統(合作なら Neo が教えてくる)。
  const BR=branchState(branch&&branch.level,branch&&branch.path);
  const bl=balloonsFor(Hd,branch&&branch.level);
  let bi=0,skipped=0,mt=0,buf=[],pc=[],open=null;
  const map={"1":"d","2":"k","3":"D","4":"K","5":"r","6":"R","7":"b","9":"b"};
  let curLen=TPM,nextLen=null;
  const fin=()=>{for(const c of pc)if(c.k==="MEASURE"){const L2=parseSig(c.v);if(L2){if(c.idx===0)curLen=L2;else nextLen=L2;c.idx=0}}
    const L=buf.length,ml=curLen,at=k=>mt+(L?Math.round(k*ml/L):0);
    for(const c of pc){const o={t:at(c.idx),k:c.k};if(c.v!=null)o.v=c.v;st.cmds.push(o)}
    buf.forEach((ch,k)=>{const t=at(k);if(ch==="8"){if(open){open.end=t;open=null}return}
      const ty=map[ch];if(!ty||(open&&TYPES[ty].long))return;const n={t,type:ty};
      if(TYPES[ty].long){if(ty==="b")n.count=bl[bi++]||5;open=n}st.notes.push(n)});
    mt+=ml;buf=[];pc=[];if(nextLen){curLen=nextLen;nextLen=null}};
  for(let i=pick.from;i<pick.to;i++){const l=lines[i].replace(/\/\/.*$/,"").trim();if(!l)continue;
    if(l[0]==="#"){const m=l.match(/^#([A-Z]+)\s*(.*)$/i);if(!m)continue;const k=m[1].toUpperCase();
      if(BR.line(k))continue;            // 系統の切り替えそのもの
      if(!BR.active())continue;          // 流していない系統の命令
      if(CMDS[k]){const c={k,idx:buf.length};if(CMDS[k].val)c.v=CMDS[k].val==="text"?m[2].trim():parseFloat(m[2]);pc.push(c)}else skipped++;continue}
    // 流していない系統の小節は、数にも時間にも入れない(Neo と同じ)。
    for(const ch of l){if(ch===","){if(BR.active())fin();else{buf=[];pc=[]}}
      else if(BR.active()&&/[0-9]/.test(ch))buf.push(ch)}}
  if((buf.length||pc.length)&&BR.active())fin();
  for(const n of st.notes)if(TYPES[n.type].long&&n.end==null)n.end=n.t+TPB;
  // 読まなかったコースは本文のまま預かる(書き出しで同じ場所へ戻す)。
  // 塊の数え方が解析と食い違う変わった本文のときは預からない(二重に
  // 書き出すほうが怖い)。lost にその数を入れて呼び手に知らせる。
  let lost=0;
  {const sp=splitCourses(text),bodies=sp.blocks.filter(b=>b.body).length;
   if(bodies===sc.courses.length){let n=0;
     for(const b of sp.blocks){
       if(b.body&&n++===pi)st.at=st.others.length;
       else st.others.push({key:b.key,level:b.level,body:b.body,branch:b.branch,text:b.text})}}
   else lost=sc.courses.length-1}
  return{state:st,skipped,lost};
}

/* ===== 試聴 ===== */

function synthDon(ac){const sr=ac.sampleRate,n=Math.floor(sr*.22),b=ac.createBuffer(1,n,sr),d=b.getChannelData(0);let ph=0;
  for(let i=0;i<n;i++){const t=i/sr,f=85+(190-85)*Math.exp(-t*45);ph+=2*Math.PI*f/sr;
    const body=(Math.sin(ph)+.35*Math.sin(2*ph))*Math.exp(-t*20),atk=(Math.random()*2-1)*Math.exp(-t*500);d[i]=Math.tanh((.9*body+.45*atk)*1.3)*.85}return b}
function synthKa(ac){const sr=ac.sampleRate,n=Math.floor(sr*.05),b=ac.createBuffer(1,n,sr),d=b.getChannelData(0);let prev=0;
  for(let i=0;i<n;i++){const t=i/sr,nz=Math.random()*2-1,hp=i?nz-prev:0;prev=nz;const tone=.25*Math.sin(2*Math.PI*950*t);
    d[i]=Math.tanh(((.9*hp+tone)*Math.exp(-t*85))*1.2)*.8}return b}
function b64buf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function actx(){if(!AUD.ctx){const ac=AUD.ctx=new(window.AudioContext||window.webkitAudioContext)();SE.don=synthDon(ac);SE.ka=synthKa(ac);
  for(const k of ["don","ka","pop"])ac.decodeAudioData(b64buf(SE_DATA[k])).then(b=>{SE[k]=b}).catch(()=>{})}return AUD.ctx}
const VOL=(()=>{try{return Object.assign({master:80,se:80,song:80},JSON.parse(localStorage.getItem("neotja-vol")||"{}"))}catch(e){return{master:80,se:80,song:80}}})();
const GAIN={};
function gains(){const ac=actx();if(!GAIN.master){GAIN.master=ac.createGain();GAIN.master.connect(ac.destination);
  GAIN.se=ac.createGain();GAIN.se.connect(GAIN.master);GAIN.song=ac.createGain();GAIN.song.connect(GAIN.master)}
  GAIN.master.gain.value=VOL.master/100;GAIN.se.gain.value=VOL.se/100;GAIN.song.gain.value=VOL.song/100;return GAIN}
function hitSE(when,type){const ac=AUD.ctx,buf=type==="pop"?SE.pop:(TYPES[type].don?SE.don:SE.ka);if(!buf)return;
  const src=ac.createBufferSource();src.buffer=buf;src.connect(gains().se);src.start(when)}
let PL=null;
/* from(譜面の秒)を渡すと、カーソルではなくその所から流す。合作で
   「編集者と同じ所から」流すのに要る。 */
function play(from){const ac=actx();if(ac.state==="suspended")ac.resume();closePicker();V.pending=null;
  const sec0=(from==null?t2s(V.cur):+from),tick0=(from==null?V.cur:s2t(sec0)),start=ac.currentTime+.08;
  PL={sec0,start,q:S.notes.filter(n=>!TYPES[n.type].long&&n.t>=tick0).map(n=>({s:t2s(n.t),type:n.type}))
    .concat(S.notes.filter(n=>n.type==="b"&&n.end>=tick0).map(n=>({s:balloonPop(n),type:"pop"}))).sort((a,b)=>a.s-b.s),qi:0,end:t2s(lastTick())+1.5};
  if(AUD.buf){const off=+S.offset||0,a=sec0-off,src=ac.createBufferSource();src.buffer=AUD.buf;src.connect(gains().song);
    if(a>=0)src.start(start,a);else src.start(start-a,0);AUD.src=src;PL.end=Math.max(PL.end,AUD.buf.duration+off)}
  V.playing=true;V.pos=sec0;$("tPlay").innerHTML=ICON.stop+"<small>停止</small>";$("tPlay").setAttribute("aria-label","停止");
  coPlaySend(true);requestAnimationFrame(tick)}
function stop(){if(!V.playing)return;V.playing=false;if(AUD.src){try{AUD.src.stop()}catch(e){}AUD.src=null}
  // 止めたらカーソルを再生位置のグリッドへ（Neo と同じく切り捨て）
  const t=s2t(V.pos),m=mIndex(t);V.cur=slotTick(m,Math.floor((t-mStart(m))/mLen(m)*mGrid(m)+1e-6));
  $("tPlay").innerHTML=ICON.play+"<small>再生</small>";$("tPlay").setAttribute("aria-label","再生");
  coPlaySend(false);draw()}
function tick(){if(!V.playing)return;const ac=AUD.ctx,now=PL.sec0+(ac.currentTime-PL.start);
  while(PL.qi<PL.q.length&&PL.q[PL.qi].s<now+.25){const q=PL.q[PL.qi++],w=PL.start+(q.s-PL.sec0);if(w>=ac.currentTime-.01)hitSE(Math.max(w,ac.currentTime),q.type)}
  V.pos=Math.max(PL.sec0,now);V.view=V.pos-V.span*NEO.FOLLOW_FRAC_PLAY;draw();if(now>PL.end){stop();return}requestAnimationFrame(tick)}
$("tPlay").onclick=()=>V.playing?stop():play();

/* ===== 合作(Neo のホストが配ったページのときだけ) =====
   利用者の指定 2026-10-22。ページと WebSocket は同じ口から来るので、行き先は
   自分の出どころで決まる(https なら wss)。

   **ここでは本文を書かない。** 受け取った本文をそのまま持って、描くために
   解析するだけ。打てるようにするのは次の段(op を送る)。 */
const CO={on:false,ws:null,me:"",pen:"",text:"",rev:0,course:"",roster:[],peers:{},
  song:null,songAsked:"",branch:null,
  /* songRaw: 保存用にもらっている最中の元ファイル。rawWait: その待ち。 */
  songRaw:null,rawWait:null};

/* 名前の決まりは PC 側と同じ(かな漢字5文字 / 英数字8文字ぶんの幅まで)。 */
const NAME_W_MAX=8.0;
function nameWidth(s){let w=0;for(const ch of s)w+=(ch.charCodeAt(0)<0x100||/[｡-ﾟ]/.test(ch))?1:1.6;return w}
function clipName(s){let out="",w=0;
  for(const ch of String(s||"")){const d=(ch.charCodeAt(0)<0x100||/[｡-ﾟ]/.test(ch))?1:1.6;
    if(w+d>NAME_W_MAX+1e-9)break;out+=ch;w+=d}
  return out}

/* 本文の指紋。Neo の text_hash と同じ(UTF-8 の SHA-1 の頭12桁)。
   crypto.subtle は http の LAN では使えない(安全な文脈でないと生えない)ので、
   ここに短いものを置く。 */
function sha1hex(bytes){
  const ml=bytes.length,withOne=ml+1,blocks=Math.ceil((withOne+8)/64),buf=new Uint8Array(blocks*64);
  buf.set(bytes);buf[ml]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(blocks*64-4,(ml*8)>>>0,false);
  dv.setUint32(blocks*64-8,Math.floor(ml/536870912),false);
  let h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0;
  const w=new Int32Array(80);
  const rol=(n,s)=>(n<<s)|(n>>>(32-s));
  for(let b=0;b<blocks;b++){
    for(let i=0;i<16;i++)w[i]=dv.getInt32(b*64+i*4,false);
    for(let i=16;i<80;i++)w[i]=rol(w[i-3]^w[i-8]^w[i-14]^w[i-16],1);
    let a=h0,bb=h1,c=h2,d=h3,e=h4;
    for(let i=0;i<80;i++){let f,k;
      if(i<20){f=(bb&c)|(~bb&d);k=0x5A827999}
      else if(i<40){f=bb^c^d;k=0x6ED9EBA1}
      else if(i<60){f=(bb&c)|(bb&d)|(c&d);k=0x8F1BBCDC}
      else{f=bb^c^d;k=0xCA62C1D6}
      const t=(rol(a,5)+f+e+k+w[i])|0;e=d;d=c;c=rol(bb,30);bb=a;a=t}
    h0=(h0+a)|0;h1=(h1+bb)|0;h2=(h2+c)|0;h3=(h3+d)|0;h4=(h4+e)|0}
  return [h0,h1,h2,h3,h4].map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
function textHash(s){return sha1hex(new TextEncoder().encode(s)).slice(0,12)}

/* ===== 本文の中のコースを拾う ===== */
const DIFF={"0":"Easy","EASY":"Easy","1":"Normal","NORMAL":"Normal","2":"Hard","HARD":"Hard",
  "3":"Oni","ONI":"Oni","4":"Edit","EDIT":"Edit"};
function courseKeyOf(v){return DIFF[String(v==null?"":v).trim().toUpperCase()]||"Oni"}
/* そのコースだけに効く見出し。これより前のものは譜面ぜんたいのもの。 */
const PER_COURSE=new Set(["COURSE","LEVEL","BALLOON","SCOREINIT","SCOREDIFF","STYLE",
  "BALLOONNOR","BALLOONEXP","BALLOONMAS","EXAM1","EXAM2","EXAM3","GAUGEINCR","TOTAL","HISCOREMODE"]);
/* 戻りは [{key, head, from, to}]。from/to は本文の行(#START の次 〜 #END の前)。 */
function scanCourses(text){
  const lines=text.replace(/\r/g,"").split("\n"),g={},out=[];
  let cur={},from=-1,seenCourse=false;
  for(let i=0;i<lines.length;i++){
    const l=lines[i].split("//")[0].trim();
    if(/^#START\b/i.test(l)){from=i+1;continue}
    if(/^#END\b/i.test(l)){
      if(from>=0)out.push({key:courseKeyOf(cur.COURSE!==undefined?cur.COURSE:g.COURSE),
        head:Object.assign({},g,cur),from,to:i});
      cur={};from=-1;continue}
    if(from>=0)continue;                 // 本文の行は見出しではない
    const m=l.match(/^([A-Za-z0-9]+):(.*)$/);if(!m)continue;
    const k=m[1].toUpperCase(),v=m[2].trim();
    if(k==="COURSE")seenCourse=true;
    if(seenCourse||PER_COURSE.has(k))cur[k]=v;else g[k]=v}
  if(from>=0)out.push({key:courseKeyOf(cur.COURSE!==undefined?cur.COURSE:g.COURSE),
    head:Object.assign({},g,cur),from,to:lines.length});
  return{lines,courses:out}}

/* ===== 受け取った本文を画面へ ===== */
function coApply(){
  const r=importTJA(CO.text,CO.course,CO.branch);
  if(!r){toast("合作: 譜面を読めませんでした");return}
  // **localStorage へは書かない。** 端末に置いてある自分の譜面を、
  // 預かっているだけの本文で潰さないため。
  S=r.state;V.pending=null;
  S.notes.sort((a,b)=>a.t-b.t);S.cmds.sort((a,b)=>a.t-b.t);
  buildTempo();buildMeasures();
  if(V.cur>lastTick())V.cur=0;
  buildLeft();draw();coSync();coSongMaybe()}

function coSync(){
  // いま誰が編集者か・何人居るか・繋がっているかを画面に出す。
  const el=$("tbCourse");if(!el)return;
  const base=S.course+" ★"+S.level;
  if(!CO.on){el.textContent=base;return}
  if(!coLive()){el.textContent=base+" / 繋ぎ直し中…";return}
  const n=(CO.roster||[]).length;
  const sp=CO.song||CO.songRaw;
  if(sp){const pc=sp.size?Math.min(99,Math.floor(sp.got*100/sp.size)):0;
    el.textContent=base+" / 音源 "+pc+"%";return}
  el.textContent=base+" / "+(CO.pen?("編集: "+CO.pen):"編集者なし")
    +(n>1?(" / "+n+"人"):"")+(coBranchy()?(" / 分岐:"+coBranchName()):"")}


/* ===== 相手の居場所(利用者の指定 2026-10-23) =====
   だれがどこを見ているかを出す。**譜面には一切効かない飾り**なので、
   落ちても困らない。色の決め方は Neo の _collab_peer_color と同じ
   (名前の符号位置の和)。同じ人は両方の画面で同じ色になる。 */
const CO_COLORS=["#7aa2f7","#9ece6a","#e0af68","#bb9af7","#f7768e","#2ac3de"];
function coColor(name){let n=0;for(const ch of String(name||""))n+=ch.codePointAt(0);
  return CO_COLORS[n%CO_COLORS.length]}

/* 自分が見ている所の、本文での文字位置。Neo の文字エディタが相手の居る
   行に色を敷くのに使う。小節の行の頭でよい(飾りなので多少ずれても困らない)。 */
function coCharPos(){
  if(!CO.text)return 0;
  const sc=scanCourses(CO.text),c=sc.courses.find(x=>x.key===CO.course)||sc.courses[0];
  if(!c)return 0;
  const m=mIndex(V.playing?s2t(V.pos):V.cur);
  let seen=0,li=c.from;
  for(let i=c.from;i<c.to;i++){
    const l=sc.lines[i].split("//")[0],tr=l.trim();
    if(!tr||tr[0]==="#")continue;
    li=i;const k=(l.match(/,/g)||[]).length;
    if(seen+k>m)break;
    seen+=k}
  let pos=0;for(let i=0;i<li;i++)pos+=sc.lines[i].length+1;
  return pos}

/* 送るのは間引く(カーソルは指に付いて何十回も動く)。同じ所なら送らない。 */
const CO_HERE_MS=120;
let coHereT=null,coHereWas="";
function coHereKick(){
  if(!CO.on||!coLive()||coHereT)return;
  coHereT=setTimeout(()=>{coHereT=null;coHereSend()},CO_HERE_MS)}
function coHereSend(){
  if(!CO.on||!coLive())return;
  // ct は**音源の時刻**(Neo の bar_times と同じ数え方)。譜面の時刻から
  // OFFSET を引く。再生中は再生位置を、止まっていればカーソルを出す。
  const off=+S.offset||0,sec=(V.playing?V.pos:t2s(V.cur))-off;
  const key=CO.course+"/"+sec.toFixed(3);
  if(key===coHereWas)return;
  coHereWas=key;
  // mob を付ける。これが付いた here では**コースを追わない**
  // (スマホ同士で引っぱり合うため)。Neo は知らない印を黙って捨てる。
  coSend({t:"here",who:CO.me,pos:coCharPos(),ct:sec,course:CO.course,mob:1})}

/* 受けたもの。{名前:{ct(音源の時刻), at}} */
function coPeerSet(who,ct){
  if(!who||who===CO.me||!isFinite(ct))return;
  CO.peers[who]={ct:+ct,at:Date.now()};draw()}
/* 名簿から消えた人のぶんは捨てる。**時間では消さない** — じっとして
   いる人は here を出さないので、古いからといって居ないとは限らない。 */
function coPeerPrune(){
  const list=CO.roster||[];if(!list.length)return;
  const keep=new Set(list.filter(n=>n!==CO.me));
  for(const k of Object.keys(CO.peers))if(!keep.has(k))delete CO.peers[k]}

/* 譜面の上へ。点線と名札。画面の外に居るときは端へ寄せて向きを出す
   (Neo の _draw_peer_marks と同じ考え。消すと「ここ見て」が通じない)。 */
function drawPeers(){
  if(!CO.on)return;
  const names=Object.keys(CO.peers);if(!names.length)return;
  const off=+S.offset||0;
  p.font=fpx(11)+"px "+FONT;p.textBaseline="middle";
  for(const who of names.sort()){
    const q=CO.peers[who],col=coColor(who),x=sx(q.ct+off);
    const inside=x>=G.X0&&x<=W,xx=Math.min(W-2,Math.max(G.X0+1,x));
    p.strokeStyle=col;p.lineWidth=1;p.setLineDash([4,3]);
    line(crisp(xx),G.RH,crisp(xx),H);p.setLineDash([]);
    const label=(inside?"":(x<G.X0?"◀":"▶"))+who;
    const tw=p.measureText(label).width+8*K,th=15*K;
    let lx=xx+3;if(lx+tw>W)lx=xx-3-tw;
    p.fillStyle=col;p.globalAlpha=.85;p.fillRect(lx,G.RH+2,tw,th);p.globalAlpha=1;
    p.fillStyle="#10131a";p.fillText(label,lx+4*K,G.RH+2+th/2)}}

/* ===== 再生の同期(利用者の指定 2026-10-23) =====
   **配るのは編集者だけ。** 全員が配ると、受けた側がまた配り返して
   永遠に止まらない(Neo の send_playback と同じ決まり)。
   at は音源の時刻。譜面の時刻から OFFSET を引く(here の ct と同じ)。 */
let coPlayApply=false,coPlayWarned=false;
function coPlaySend(on){
  if(!CO.on||!coLive()||coPlayApply||!coMine())return;
  const off=+S.offset||0,sec=(V.playing?V.pos:t2s(V.cur))-off;
  coSend({t:"play",at:sec,on:!!on})}

/* その秒(譜面の時刻)の、いちばん近い手前のグリッドへカーソルを置く。
   stop() がやっているのと同じ数え方。 */
function curFromSec(sec){
  const t=s2t(Math.max(0,sec)),m=mIndex(t);
  return slotTick(m,Math.floor((t-mStart(m))/mLen(m)*mGrid(m)+1e-6))}

/* 編集者が再生/一時停止した。同じ所から同じ状態にする。
   **いまの状態と見比べて切り替えない**(Neo の _collab_take_playback と
   同じ理由。音が鳴り始めるのは非同期なので、直後の V.playing は当てに
   ならない)。言われたとおりに流す/止める。 */
function coPlayTake(at,on){
  if(!CO.on||coMine())return;
  const off=+S.offset||0,sec=Math.max(0,(+at||0)+off);
  coPlayApply=true;
  try{
    if(V.playing){V.playing=false;
      if(AUD.src){try{AUD.src.stop()}catch(e){}AUD.src=null}}
    if(on){play(sec)}
    else{V.cur=curFromSec(sec);V.pos=sec;
      V.view=t2s(V.cur)-V.span*NEO.FOLLOW_FRAC;
      $("tPlay").innerHTML=ICON.play+"<small>再生</small>";
      $("tPlay").setAttribute("aria-label","再生");draw()}
  }finally{coPlayApply=false}
  // 画面を一度も触っていない端末は音が出せない(ブラウザの決まり)。
  // 譜面は流れるので、音だけ出ないことをその場で言う。
  if(on&&AUD.ctx&&AUD.ctx.state!=="running"&&!coPlayWarned){
    coPlayWarned=true;toast("画面を一度さわると音も鳴ります")}}

/* ===== 合作の音源(利用者の指定 2026-10-24) =====
   ホストは song_begin のあと、256KB ずつ**生の枠**で送ってくる。
   繋ぎ直して decodeAudioData に渡す。
   **端末には残さない。** 本文と同じで預かりもの。 */
function coSongChunk(buf){
  const s=CO.songRaw||CO.song;if(!s)return;
  const ab=(buf&&buf.byteLength!=null)?buf:null;if(!ab)return;
  s.parts.push(ab);s.got+=ab.byteLength;
  // 進み具合は名札の所に出す(ここだけ書き換える)。
  coSync()}

function coSongDone(){
  const s=CO.song;CO.song=null;coSync();
  if(!s||!s.got){if(s)toast(s.name+(' を受け取れませんでした'));return}
  const all=new Uint8Array(s.got);let o=0;
  for(const p of s.parts){all.set(new Uint8Array(p),o);o+=p.byteLength}
  s.parts.length=0;
  // decodeAudioData は渡した入れ物を空にするので、控えを取ってから。
  AUD.bytes=all.buffer.slice(0);AUD.fromHost=true;AUD.raw=null;
  actx().decodeAudioData(all.buffer).then(b=>{
    AUD.buf=b;AUD.name=s.name;AUD.peaks=null;buildPeaks();draw();
    toast(s.name+" を受け取りました")},
    ()=>{AUD.bytes=null;AUD.buf=null;
      toast(s.name+" は、この端末では鳴らせない形式でした")})}

/* ===== 保存用に、ホストの元ファイルをもらう(利用者の指定 2026-10-24) =====
   鳴らすのは作り直した m4a のままで、ZIP には**元の ogg**を入れる。
   m4a から ogg へ戻すと非可逆を2度通るので、戻さずにもらう。
   頼むのは保存を押したときだけ。一度もらったら使い回す。 */
function coSongRawAsk(){
  if(AUD.raw&&AUD.raw.bytes)return Promise.resolve(AUD.raw);
  if(!CO.on||!coLive()||CO.song)return Promise.resolve(null);
  if(CO.rawWait)return CO.rawWait.p;
  let done;const p=new Promise(r=>{done=r});
  CO.rawWait={done:done,p:p,tm:0};
  coSend({t:"song_req",raw:1});
  toast("元の音源をもらっています…");
  // 返事が来ないまま待ち続けない(ホストが持っていないこともある)。
  CO.rawWait.tm=setTimeout(()=>{if(CO.rawWait){const w=CO.rawWait;CO.rawWait=null;CO.songRaw=null;w.done(null)}},180000);
  return p}
function coSongRawDone(){
  const s=CO.songRaw;CO.songRaw=null;coSync();
  const w=CO.rawWait;CO.rawWait=null;
  if(w&&w.tm)clearTimeout(w.tm);
  if(s&&s.got){const all=new Uint8Array(s.got);let o=0;
    for(const q of s.parts){all.set(new Uint8Array(q),o);o+=q.byteLength}
    s.parts.length=0;AUD.raw={name:s.name,bytes:all.buffer}}
  if(w)w.done(AUD.raw&&AUD.raw.bytes?AUD.raw:null)}

/* 譜面の WAVE: が指す音源を持っていなければ、もらいに行く。
   **一度頼んだ名前はもう頼まない**(ホストが音源を持っていないときは
   返事が来ないので、繰り返すと鳴り続ける)。 */
function coSongMaybe(){
  if(!CO.on||!coLive()||CO.song)return;
  const want=String((S.hdr&&S.hdr.WAVE)||"");
  if(!want)return;
  if(AUD.buf&&AUD.name===want)return;
  if(CO.songAsked===want)return;
  CO.songAsked=want;
  // aac を頼む。iOS は ogg を鳴らせないので、ホストが作り直して送る。
  coSend({t:"song_req",aac:1});
  toast("音源をもらっています…")}
/* ===== 同期し直す(利用者の報告 2026-10-24) =====
   再生の位置がずれたとき、これまでは入り直すしかなかった。
   本文を配り直してもらい、音源と居場所も取り直す。 */
function coResync(){
  if(!CO.on){toast("合作に入っていません");return}
  if(!coLive()){
    toast("繋ぎ直しています…");coTries=0;coConnect();return}
  coSend({t:"resync"});
  CO.songAsked="";coHereWas="";
  coHereSend();
  // 音源を持っていなければ、ついでにもらい直す。
  coSongMaybe();
  toast("同期し直しています…")}

/* 自分が編集者か。 */
function coMine(){return CO.on&&!!CO.pen&&CO.pen===CO.me}
/* いま本当に繋がっているか(繋ぎ直しの最中は false)。 */
function coLive(){return !!CO.ws&&CO.ws.readyState===1}
/* いま書いていいか。駄目な理由はその場で出す。 */
function coCanWrite(){
  if(!coLive()){toast("繋ぎ直しています…");return false}
  if(!coMine()){toast("編集権がありません");return false}
  // 分岐は**系統を揃えて**打てるようになった(2026-10-24)。ただし
  // 向こうが系統を教えてくれていないときは、数え方が揃わないので止める。
  if(coBranchy()&&!CO.branch){
    toast("分岐の系統がまだ届いていません");return false}
  return true}
/* まだ op にしていない操作(連打・風船・命令・大小・設定・ZIP)。 */
function coRO(){if(!CO.on)return false;
  toast(coMine()?"これはまだスマホから変えられません":"いまは見るだけです(編集権がありません)");
  return true}

/* ===== 打ち込みは「場所と種類」だけ送る =====
   本文は書かない。書くのはホストで、**作譜モードと同じ入口**(note_edit の
   run_op)を通る。置き換えの決まり・連打の途中を断る・BALLOON: の並べ直し・
   末尾の空小節まで、PC で効いているものがそのまま効く。
   返ってきた本文が本物なので、こちらは**先に描いておくだけ**。 */

/* その小節で、渡した刻みがちょうど乗る分割数。画面の分割で足りればそれを
   使う(でないと本文が無駄に細かく割られる)。 */
function gridFor(m,ticks){
  const L=mLen(m),base=mGrid(m),st=mStart(m);
  if(ticks.every(t=>((t-st)*base)%L===0))return base;
  let d=L;for(const t of ticks)d=gcd(d,Math.abs(t-st));
  return Math.max(1,Math.round(L/d))}
function slotOf(m,t,g){return Math.round((t-mStart(m))*g/mLen(m))}
function addrOf(t){const m=mIndex(t),g=gridFor(m,[t]);return{m,k:slotOf(m,t,g),grid:g}}

/* そのコースの小節ごとの音符の字。向こうの measure_spans と同じ数え方
   (命令行とコメントの中のカンマは区切りにしない)。 */
function coMeasureNotes(course){
  const sc=scanCourses(CO.text),c=sc.courses.find(x=>x.key===(course||CO.course));
  if(!c)return[];
  // **系統も揃える。** ここがずれると、向こうの小節番号と食い違った
  // まま「思っている中身」を送ることになり、安全弁が意味を失う。
  const BR=branchState(CO.branch&&CO.branch.level,CO.branch&&CO.branch.path);
  const out=[];let cur="";
  for(let i=c.from;i<c.to;i++){
    let l=sc.lines[i];const h=l.indexOf("//");if(h>=0)l=l.slice(0,h);
    const tr=l.trim();
    if(tr[0]==="#"){const m=tr.match(/^#([A-Z]+)/i);
      if(m)BR.line(m[1].toUpperCase());continue}
    for(const ch of l){
      if(ch===","){if(BR.active())out.push(cur);cur=""}
      else if(ch>="0"&&ch<="9")cur+=ch}}
  if(cur.length&&BR.active())out.push(cur);
  return out}

/* 分岐のある譜面か。**こちらの解析は分岐を知らない** — 3つの系統を
   3小節として並べて読むので、小節の番号が向こうとずれる(実測: 同じ譜面を
   Neo が3小節、こちらが5小節と数えた)。打つと別の場所が書き換わるので、
   見るだけにする。 */
/* いま映している系統の呼び名。 */
function coBranchName(){
  const lv=CO.branch&&CO.branch.level;
  if(lv==="N")return "普通";
  if(lv==="E")return "玄人";
  if(lv==="M")return "達人";
  if(lv==="auto")return "自動";
  return "？"}
function coBranchy(){
  const sc=scanCourses(CO.text),c=sc.courses.find(x=>x.key===CO.course);
  if(!c)return false;
  for(let i=c.from;i<c.to;i++)
    if(/^\s*#BRANCHSTART/i.test(sc.lines[i].split("//")[0]))return true;
  return false}

function coOp(body){
  const o=Object.assign({t:"op",op:"chart",who:CO.me,course:CO.course},body);
  // 「その小節はこうなっているはず」を添える。向こうは書く前に見比べて、
  // 違えば書かずに本文を配り直す(解析の食い違いをここで止める)。
  if(Array.isArray(o.a)){
    const ms=coMeasureNotes(o.course);
    if(ms[o.a[0]]!==undefined)o.expect=ms[o.a[0]]}
  coSend(o)}

/* ドン・カッ(大小も同じ口)。置く/消す/差し替えの決まりは向こう持ち。 */
function coKeyOp(type){
  if(S.notes.some(n=>TYPES[n.type].long&&V.cur>n.t&&V.cur<=n.end)){
    toast("連打の途中には置けません");return}
  const p=addrOf(V.cur);
  coOp({kind:"key",a:[p.m,p.k],grid:p.grid,char:TYPES[type].ch});
  // 先に描く(向こうの op_key と同じ決まり: 同じものをもう一度で消える)。
  const hit=S.notes.find(n=>n.t===V.cur&&!TYPES[n.type].long);
  if(hit)S.notes.splice(S.notes.indexOf(hit),1);
  if(!hit||hit.type!==type)S.notes.push({t:V.cur,type});
  S.notes.sort((a,b)=>a.t-b.t);buildLeft();draw()}

/* 消す。カーソルの所のものを1つ。 */
function coDelOp(){
  const n=S.notes.find(x=>x.t===V.cur)
    ||S.notes.find(x=>TYPES[x.type].long&&V.cur>x.t&&V.cur<=x.end);
  if(!n){toast("ここに音符はありません");return}
  const p=addrOf(V.cur);
  coOp({kind:"delete",a:[p.m,p.k],grid:p.grid});
  S.notes.splice(S.notes.indexOf(n),1);buildLeft();draw()}

/* 大↔小。 */
function coSizeOp(){
  const n=S.notes.find(x=>x.t===V.cur)
    ||S.notes.find(x=>TYPES[x.type].long&&V.cur>x.t&&V.cur<=x.end);
  if(!n){toast("カーソルの位置に音符がありません");return}
  const p=addrOf(n.t);
  coOp({kind:"size",a:[p.m,p.k],grid:p.grid});
  const FLIP={d:"D",D:"d",k:"K",K:"k",r:"R",R:"r"};
  if(FLIP[n.type]){n.type=FLIP[n.type];draw()}}

/* 連打・風船。始点で1回、終点でもう1回。打数は長さから向こうが決める
   (PC の作譜と同じ)。 */
function coLongOp(type){
  if(!V.pending||V.pending.type!==type){
    V.pending={t:V.cur,type};
    toast("カーソルを終点まで動かして、もう一度「"+TYPES[type].name+"」");
    buildLeft();draw();return}
  const s=V.pending;V.pending=null;
  if(V.cur===s.t){toast("終点は始点と別の所にしてください");buildLeft();draw();return}
  const t0=Math.min(s.t,V.cur),t1=Math.max(s.t,V.cur);
  const m0=mIndex(t0),m1=mIndex(t1),grids={};
  for(let m=m0;m<=m1;m++){
    const ticks=[];if(m===m0)ticks.push(t0);if(m===m1)ticks.push(t1);
    grids[m]=ticks.length?gridFor(m,ticks):mGrid(m)}
  coOp({kind:"long",a:[m0,slotOf(m0,t0,grids[m0])],b:[m1,slotOf(m1,t1,grids[m1])],
    grid:grids[m0],grids,char:TYPES[type].ch});
  buildLeft();draw()}

/* ===== 命令(#BPMCHANGE / #SCROLL / #MEASURE / ゴーゴー / 小節線) =====
   値のある命令は command、ゴーゴーと小節線は区間の印(marker)。どちらも
   向こうで作譜と同じ処理が走る。 */
const CO_REGION={GOGOSTART:["GOGO","on"],GOGOEND:["GOGO","off"],
  BARLINEOFF:["BARLINE","on"],BARLINEON:["BARLINE","off"]};

function coCmdAdd(name,raw){
  const p=addrOf(V.cur);
  if(CO_REGION[name]){
    const[region,which]=CO_REGION[name];
    coOp({kind:"marker",a:[p.m,p.k],grid:p.grid,region,which,present:true});
    return true}
  if(name==="MEASURE"){
    // 拍子は小節の頭へ(画面の案内どおり)。
    const m=mIndex(V.cur);
    coOp({kind:"command",a:[m,0],grid:mGrid(m),name,value:String(raw)});
    return true}
  const v=parseFloat(raw);
  if(!isFinite(v)){toast("値を入れてください");return false}
  coOp({kind:"command",a:[p.m,p.k],grid:p.grid,name,value:v});
  return true}

function coCmdDel(c){
  const p=addrOf(c.t);
  if(CO_REGION[c.k]){
    const[region,which]=CO_REGION[c.k];
    coOp({kind:"marker",a:[p.m,p.k],grid:p.grid,region,which,present:false});
    return}
  coOp({kind:"command",a:[p.m,p.k],grid:p.grid,name:c.k,value:null})}

/* 小節まるごと。向こうは文字の位置で指すので、何小節目かだけ送る。 */
function coMeasureOp(what){
  coOp({kind:"measure",what,m:mIndex(V.cur)});
  toast({dup:"小節を複製しました",del:"小節を削除しました",
    ins:"空の小節を入れました"}[what]||"")}

/* ===== 編集権 ===== */
function coPenReq(){coSend({t:"pen_req",who:CO.me});toast("編集権をお願いしました")}
function coPenFree(){coSend({t:"pen_free",who:CO.me});toast("編集権を返しました")}
/* **いまの編集者なら、自分で誰かへ渡せる**(PC の「編集を任せる」と同じ)。 */
function coPenGive(){
  const others=(CO.roster||[]).filter(n=>n!==CO.me);
  if(!others.length){openSheet(`<h2>編集権を渡す</h2>
    <p class="note">ほかに部屋に居る人が居ません。</p>
    <div class="row"><button class="btn pri" id="gX">閉じる</button></div>`);
    $("gX").onclick=closeSheet;return}
  openSheet(`<h2>編集権を渡す</h2><div class="menu">${
    others.map((n,i)=>`<button class="btn" data-i="${i}">${esc(n)}</button>`).join("")}</div>
  <div class="row"><button class="btn" id="gX">やめる</button></div>`);
  document.querySelectorAll("#card .menu .btn").forEach(b=>b.onclick=()=>{
    const to=others[+b.dataset.i];closeSheet();
    coSend({t:"pen_give",from:CO.me,to});toast(to+" に渡しました")});
  $("gX").onclick=closeSheet}

/* 部屋を出る。**端末に置いてある自分の譜面へ戻す** — 預かっていた本文を
   そのまま残すと、どちらを触っているのか分からなくなるため。 */
function coLeave(why){
  const was=CO.on;
  CO.on=false;CO.pen="";CO.text="";CO.course="";CO.roster=[];CO.peers={};
  CO.song=null;CO.songAsked="";CO.branch=null;coHereWas="";coPlayApply=false;
  CO.songRaw=null;if(CO.rawWait){const rw=CO.rawWait;CO.rawWait=null;
  if(rw.tm)clearTimeout(rw.tm);rw.done(null)}
  if(coTimer){clearTimeout(coTimer);coTimer=null}
  coTries=0;coWakeOff();
  const ws=CO.ws;CO.ws=null;
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}}
  let raw=null;try{raw=localStorage.getItem("neotja-mobile2")}catch(e){}
  let st=null;try{st=raw?JSON.parse(raw):null}catch(e){st=null}
  S=(st&&Array.isArray(st.notes))?st:sample();
  V.cur=0;V.pending=null;V.playing=false;V.view=-V.span*NEO.FOLLOW_FRAC;
  buildTempo();buildMeasures();buildLeft();draw();coSync();
  if(was)toast(why||"ルームから退出しました");
}

function coSend(msg){try{CO.ws&&CO.ws.readyState===1&&CO.ws.send(JSON.stringify(msg))}catch(e){}}

function coMsg(raw){
  // 文字でないものは音源の切れはし。
  if(typeof raw!=="string"){coSongChunk(raw);return}
  let m;try{m=JSON.parse(raw)}catch(e){return}
  const t=m&&m.t;
  if(t==="full"){CO.text=String(m.text==null?"":m.text);CO.rev=+m.rev||0;
    CO.pen=String(m.pen||"");if(m.course)CO.course=courseKeyOf(m.course);
    if(m.branch!==undefined)CO.branch=m.branch||null;coApply();return}
  if(t==="patch"){
    const p=Math.max(0,+m.pos||0),rm=Math.max(0,+m.rm||0),ins=String(m.ins==null?"":m.ins);
    CO.text=CO.text.slice(0,p)+ins+CO.text.slice(p+rm);
    CO.rev=(m.rev==null?CO.rev+1:+m.rev);coApply();return}
  if(t==="pen"){CO.pen=String(m.who||"");coSync();return}
  if(t==="who"){CO.roster=(m.list||[]).map(String);coPeerPrune();coSync();draw();return}
  if(t==="you"){
    // ホストが名前を付け直した(同じ名前の人が居た)。
    const n=String(m.who||"");
    if(n&&n!==CO.me){CO.me=n;
      try{localStorage.setItem("neotja-collab-name",n)}catch(e){}
      toast("同じ名前の人が居たので「"+n+"」になりました");coSync()}
    return}
  if(t==="here"){
    if(!m.who||m.who===CO.me)return;
    // コースは Neo に合わせる(利用者の指定)。mob の付いた here は
    // ほかのスマホのものなので追わない(引っぱり合う)。
    if(!m.mob){
      // 系統も Neo に合わせる(小節の数え方がこれで決まる)。
      const bOld=JSON.stringify(CO.branch||null);
      if(m.branch!==undefined)CO.branch=m.branch||null;
      const k=m.course?courseKeyOf(m.course):CO.course;
      if(k!==CO.course||JSON.stringify(CO.branch||null)!==bOld){
        CO.course=k;coApply()}}
    if(m.ct!=null)coPeerSet(String(m.who),+m.ct);
    return}
  if(t==="play"){coPlayTake(m.at,m.on);return}
  if(t==="song_begin"){
    const s={name:String(m.name||"song"),size:+m.size||0,got:0,parts:[]};
    // raw は保存用。鳴らさずに取り置く。
    if(m.raw)CO.songRaw=s;else CO.song=s;
    coSync();return}
  if(t==="song_end"){CO.songRaw?coSongRawDone():coSongDone();return}
  if(t==="sum"){
    // ずれていたら作り直してもらう。**文字の数え方の違い**(JS は UTF-16、
    // Python は符号位置)でずれても、ここで必ず拾える。
    if(m.hash&&CO.text&&textHash(CO.text)!==String(m.hash))coSend({t:"resync"});
    return}}

function coName(){
  let n="";try{n=localStorage.getItem("neotja-collab-name")||""}catch(e){}
  return clipName(n)}
function coAskName(then){
  const now=coName()||"スマホ";
  openSheet(`<h2>合作に入る</h2>
  <p class="note">名前は かな漢字で5文字、英数字で8文字まで。</p>
  <div class="row"><label class="fld" style="flex:2">名前<input id="coN" value="${esc(now)}" maxlength="12"></label></div>
  <div class="row"><button class="btn pri" id="coGo">入る</button><button class="btn" id="coNo">単体で使う</button></div>`);
  const go=()=>{const v=clipName($("coN").value.trim())||"スマホ";
    try{localStorage.setItem("neotja-collab-name",v)}catch(e){}
    closeSheet();then(v)};
  $("coGo").onclick=go;
  $("coN").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  $("coNo").onclick=()=>{closeSheet();try{CO.ws&&CO.ws.close()}catch(e){}}}

/* 外から中身を覗く口。試験と、様子がおかしいときの確認のために出しておく。
   **読むだけ**に使うこと(ここから直接いじると画面と食い違う)。 */
window.NEOTJA={CO,get state(){return S},get view(){return V},
  importTJA,exportTJA,scanCourses,splitCourses,courseList,switchCourse,branchyAt,courseKeyOf,textHash,coSolo,coResync,isRot,
  coColor,coCharPos,coPlayTake,curFromSec,play,stop,AUD,coSongMaybe,coSongRawAsk,CO,
  openText,closeText,txtSave,txtCmd,saveBlob,savePackage,
  buildTempo,buildMeasures,setState(st){S=st;buildTempo();buildMeasures()}};

function coURL(){return (location.protocol==="https:"?"wss://":"ws://")+location.host+"/"}

/* ===== 繋ぎ直し =====
   **スマホは画面が消えると必ず切れる。** 切れるたびに単体へ戻ると、せっかく
   入った部屋から毎回追い出される。覚えている名前で黙って入り直す。
   （戻った先でホストに同じ名前の幽霊が残っていると「スマホ2」になることが
   ある。名前がかぶらないことのほうを優先する。） */
let coTries=0,coTimer=null,coWake=null;
const CO_TRY_MAX=8;

async function coWakeOn(){
  try{if("wakeLock" in navigator&&!coWake){
    coWake=await navigator.wakeLock.request("screen");
    coWake.addEventListener("release",()=>{coWake=null})}}catch(e){}}
function coWakeOff(){try{if(coWake){coWake.release();coWake=null}}catch(e){}}

function coRetry(){
  if(coTimer)return;
  coTries++;
  if(coTries>CO_TRY_MAX){coLeave("合作: 繋がりません。単体に戻ります");return}
  const wait=Math.min(8000,400*Math.pow(2,coTries-1));
  toast("合作: 繋ぎ直しています…");
  coTimer=setTimeout(()=>{coTimer=null;coConnect()},wait)}

function coConnect(){
  let ws;try{ws=new WebSocket(coURL())}catch(e){coRetry();return}
  // 音源は**生の枠**で来る。Blob のままだと繋ぐのが面倒なので配列で。
  ws.binaryType="arraybuffer";
  CO.ws=ws;
  // 4秒で返事が無ければ諦める(初回は単体のまま / 2回目以降は繋ぎ直し)。
  const giveUp=setTimeout(()=>{try{ws.close()}catch(e){}},4000);
  ws.onopen=()=>{clearTimeout(giveUp);coTries=0;coWakeOn();
    const enter=who=>{CO.me=who;CO.on=true;coHereWas="";coSend({t:"hello",who,song:""});
      toast("合作に入りました");coSync()};
    const n=coName();
    if(n)enter(n);else coAskName(enter)};
  ws.onmessage=e=>{try{coMsg(e.data)}catch(err){}};
  ws.onclose=()=>{clearTimeout(giveUp);CO.ws=null;
    if(CO.on){
      // **部屋から出たことにはしない。** 譜面は出したまま、書けなくする。
      CO.pen="";coSync();draw();coRetry()}};
  ws.onerror=()=>{}}

/* 単独で使う口(?solo)。合作へ繋ぎに行かない。ルームの画面が配る URL に
   これが付いている(利用者の指定 2026-10-24)。 */
function coSolo(){return /(^|[?&])solo(=|&|$)/i.test(location.search||"")}

function coBoot(){
  // file:// で開いたときや、claude.ai の中では繋ぎに行かない。
  if(!/^https?:$/.test(location.protocol))return;
  /* 単独で使う口(?solo)。繋ぎに行かないので「合作に入る」も出ない。
     web に置いた版もここを通る(リポジトリの根の index.html が ?solo を
     付けて送る) — 合作の相手が居ないのに繋ぎに行くと、延々と繋ぎ直しを
     繰り返すため。 */
  if(coSolo()){toast("単体で使います");return}
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible")return;
    coWakeOn();
    // 画面が戻ったら、待たずにその場で繋ぎ直す。
    if(CO.on&&!coLive()&&!coTimer){coTries=0;coConnect()}});
  coConnect()}
